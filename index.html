<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStudio - Vraie Vidéo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--panel:#14141e;--line:rgba(255,255,255,.1);--dim:#a1a1aa;--accent:#8b5cf6;--g1:#ec4899;--g2:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;max-width:1000px;margin:0 auto;position:sticky;top:0;background:var(--bg);z-index:90}
.logo{display:flex;align-items:center;gap:.75rem}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;justify-content:center;align-items:center}
.logo h1{font-size:1.1rem;font-weight:800;line-height:1}
.logo p{font-size:.65rem;color:var(--dim);margin-top:2px}
.menu-btn{background:#222;border:1px solid var(--line);width:40px;height:40px;border-radius:50%;font-size:1.2rem;padding:0}
#sidebar{position:fixed;top:0;right:-100%;width:80%;max-width:320px;height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:1000;transition:right .3s;padding:2rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
#sidebar.open{right:0}
.sidebar-item{background:rgba(255,255,255,.03);padding:1rem;border-radius:12px;font-weight:600;cursor:pointer;border:1px solid var(--line)}
.section{display:none;max-width:1000px;margin:0 auto;padding:1rem}
.section.active{display:block}
.hero{text-align:center;padding:1.5rem 1rem}
.hero h2{font-size:2rem;font-weight:800;line-height:1.1;margin-bottom:.8rem}
.hero h2 span{background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--dim);font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.5rem;margin-bottom:1.5rem}
.card-title{font-size:.9rem;font-weight:600;margin-bottom:1rem}
.format-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:.7rem;margin-bottom:1.5rem}
.format-card{background:#1a1a24;border:1px solid var(--line);border-radius:14px;padding:.9rem .5rem;cursor:pointer;position:relative}
.format-card.active{border-color:var(--accent);background:rgba(139,92,246,.12)}
.format-icon{font-size:1.3rem;margin-bottom:.4rem}
.format-title{font-weight:600;font-size:.75rem}
.format-ratio{position:absolute;top:8px;right:8px;font-size:.55rem;background:rgba(0,0,0,.5);padding:2px 5px;border-radius:4px}
label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.5rem;color:var(--dim)}
input,select,textarea{width:100%;padding:1rem;background:#1a1a24;border:1px solid var(--line);border-radius:12px;color:#fff;font-size:.9rem;margin-bottom:1rem;outline:none}
textarea{resize:vertical;min-height:70px}
button{cursor:pointer;padding:1rem;border-radius:12px;border:none;font-weight:600;font-size:1rem;display:flex;justify-content:center;align-items:center;gap:.5rem;width:100%;color:#fff;margin-top:.6rem}
button:disabled{opacity:.6}
.btn-primary{background:linear-gradient(135deg,var(--g1),var(--g2))}
.btn-blue{background:#3b82f6}.btn-green{background:#10b981}.btn-red{background:#ef4444}
#settingsContent{display:none;margin-top:1rem;border-top:1px solid var(--line);padding-top:1rem}
.scene-item{background:#1a1a24;border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem;display:flex;gap:1rem}
.scene-media{width:90px;height:160px;background:#000;border-radius:8px;flex-shrink:0;overflow:hidden}
.scene-media video{width:100%;height:100%;object-fit:cover}
.scene-content{flex:1;font-size:.8rem;line-height:1.4;min-width:0}
.scene-content .st{color:var(--accent);font-weight:600;margin-bottom:.4rem}
#status{font-size:.85rem;color:var(--accent);font-weight:600;margin-bottom:1rem;line-height:1.4}
#status.err{color:#f87171}
#previewArea{display:none}
#videoPlayer{width:100%;max-width:340px;border-radius:12px;margin:0 auto 1rem;display:block;background:#000}
.proj video{width:100%;max-width:300px;border-radius:10px;display:block;margin:.6rem auto}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-icon">✨</div><div><h1>NovaStudio</h1><p>Générateur de vraie vidéo IA</p></div></div>
  <button class="menu-btn" onclick="document.getElementById('sidebar').classList.add('open')">⋮</button>
</header>

<div id="sidebar">
  <button style="background:none;color:#fff;font-size:1.4rem;justify-content:flex-end;margin:0;padding:0" onclick="document.getElementById('sidebar').classList.remove('open')">✕</button>
  <div class="sidebar-item" onclick="showSection('studio')">🎬 Studio</div>
  <div class="sidebar-item" onclick="showSection('projects')">📁 Mes projets</div>
</div>

<div id="studioSection" class="section active">
  <div class="hero">
    <h2>Crée de <span>vraies vidéos</span><br>avec l'IA</h2>
    <p>L'IA génère de vraies scènes animées (mouvement réel) et non de simples images.</p>
  </div>

  <div class="card" style="padding:1rem">
    <div onclick="let s=document.getElementById('settingsContent');s.style.display=s.style.display==='block'?'none':'block'" style="font-weight:600;font-size:.85rem;cursor:pointer;display:flex;justify-content:space-between">
      <span>🔑 Clé API Agnes</span><span>▼</span>
    </div>
    <div id="settingsContent">
      <label>Clé Agnes</label>
      <input type="password" id="agnesApiKey" placeholder="sk-...">
    </div>
  </div>

  <div class="card">
    <div class="card-title">1. Format</div>
    <div class="format-grid" id="formatGrid"></div>

    <div class="card-title">2. Détails</div>
    <label>Personnage imposé</label>
    <select id="agentSelect">
      <option value="">Automatique</option>
      <option value="Photorealistic African woman">Africaine (femme)</option>
      <option value="Photorealistic African man">Africain (homme)</option>
      <option value="Photorealistic Mixed-race woman">Métisse (femme)</option>
      <option value="Photorealistic European woman">Européenne (femme)</option>
      <option value="Photorealistic European man">Européen (homme)</option>
    </select>

    <label>Langue de la voix</label>
    <select id="langSelect">
      <option>Français</option><option>Anglais</option><option>Espagnol</option>
      <option>Allemand</option><option>Italien</option><option>Portugais</option>
    </select>
    <button id="voiceBtn" class="btn-blue" style="margin:-.4rem 0 1rem" onclick="enableVoice()">🔊 Activer une voix réaliste</button>

    <label>Décris ta vidéo (Sujet)</label>
    <textarea id="topicInput" placeholder="Ex : Un chat qui danse sur de la musique..."></textarea>

    <label>Style de narration</label>
    <select id="styleSelect">
      <option value="">Narrateur classique</option>
      <option value="trailer">🎬 Bande-annonce</option>
      <option value="ad">📢 Publicité</option>
    </select>

    <label>Nombre de scènes (1 à 4)</label>
    <input type="number" id="sceneCount" value="1" min="1" max="4">

    <button id="generateBtn" class="btn-primary" onclick="generateScript()">1. Écrire le scénario</button>
    <button class="btn-green" onclick="express()">⚡ Express : tout en un clic</button>
  </div>

  <div id="scenarioCard" class="card" style="display:none">
    <div class="card-title">3. Scénario</div>
    <div id="scenarioList"></div>
    <button id="mediaBtn" class="btn-primary" onclick="generateMedia()">2. Générer la vraie vidéo</button>
  </div>

  <div id="workspace" class="card" style="display:none">
    <div class="card-title">4. Génération en cours (Patientez...)</div>
    <div id="status"></div>
    <div id="scenesContainer"></div>
  </div>

  <div id="previewArea" class="card">
    <div class="card-title">5. Rendu final</div>
    <video id="videoPlayer" controls playsinline></video>
    <button class="btn-blue" onclick="shareVideo()">📤 Partager</button>
    <button class="btn-green" onclick="downloadVideo()">⬇️ Télécharger</button>
    <button class="btn-primary" onclick="saveProject()">💾 Sauvegarder dans Mes projets</button>
  </div>
</div>

<div id="projectsSection" class="section">
  <div class="card"><div class="card-title">📁 Mes projets</div><div id="projectsList"></div></div>
</div>

<script>
/* ========= RÉGLAGES ========= */
const AGNES_ROOT = 'https://apihub.agnes-ai.com';
const AGNES_BASE = AGNES_ROOT + '/v1';
const MODEL_TEXT  = 'agnes-2.5-flash';   
const MODEL_VIDEO = 'agnes-video-v2.0'; // Modèle de VRAIE vidéo
const NUM_FRAMES = 121, FRAME_RATE = 24; // ~5 secondes

const SIZES = {
  v: { gw: 768,  gh: 1152, cw: 720,  ch: 1280 },
  s: { gw: 768,  gh: 768,  cw: 720,  ch: 720  },
  h: { gw: 1152, gh: 768,  cw: 1280, ch: 720  }
};
const FORMATS = {
  'TikTok':       { icon: '🎵', ratio: '9:16', o: 'v', style: 'dynamic vertical social media video, vivid colors' },
  'Facebook':     { icon: '📘', ratio: '1:1',  o: 's', style: 'engaging social media video, bright and clear' },
  'YouTube':      { icon: '▶️', ratio: '16:9', o: 'h', style: 'high quality YouTube video, cinematic' },
  'Instagram':    { icon: '📸', ratio: '1:1',  o: 's', style: 'aesthetic Instagram video, stylish' },
  'Film':         { icon: '🎬', ratio: '16:9', o: 'h', style: 'cinematic movie scene, film grain, dramatic lighting' },
  'Documentaire': { icon: '🎥', ratio: '16:9', o: 'h', style: 'realistic documentary footage, natural light' }
};
const STYLES = {
  trailer: { narr: 'deep dramatic movie trailer narrator, short powerful sentences.', visual: 'epic cinematic trailer shot, dramatic lighting' },
  ad:      { narr: 'enthusiastic advertising voice, catchy benefit-focused sentences with a call to action at the end.', visual: 'glossy commercial shot, vibrant colors' }
};
const VOICES = {
  'Français': ['Mathieu', 'Celine'], 'Anglais': ['Brian', 'Amy'], 'Espagnol': ['Enrique', 'Conchita'],
  'Allemand': ['Hans', 'Marlene'],   'Italien': ['Giorgio', 'Carla'], 'Portugais': ['Ricardo', 'Vitoria']
};

let currentFormat = 'TikTok';
let videoBlob = null, videoExt = 'webm', lastTitle = '';
let audioCtx = null;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showSection(id) {
  $('sidebar').classList.remove('open');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  $(id + 'Section').classList.add('active');
  if (id === 'projects') renderProjects();
}
function buildFormats() {
  const grid = $('formatGrid');
  for (const name in FORMATS) {
    const f = FORMATS[name];
    const d = document.createElement('div');
    d.className = 'format-card' + (name === currentFormat ? ' active' : '');
    d.innerHTML = '<div class="format-icon">' + f.icon + '</div><div class="format-title"></div><div class="format-ratio">' + f.ratio + '</div>';
    d.querySelector('.format-title').textContent = name;
    d.onclick = () => {
      document.querySelectorAll('.format-card').forEach(c => c.classList.remove('active'));
      d.classList.add('active'); currentFormat = name; saveDraft();
    };
    grid.appendChild(d);
  }
}
window.addEventListener('load', () => {
  buildFormats();
  try { if (localStorage.getItem('novaPuter') === '1') loadPuter().then(markVoice); } catch (e) {}
  try { const k = localStorage.getItem('agnesApiKey'); if (k) $('agnesApiKey').value = k; } catch (e) {}
});
function setStatus(msg, isErr) { const s = $('status'); s.textContent = msg; s.className = isErr ? 'err' : ''; }

async function agnesFetch(url, opts, tries = 5) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    let r;
    try { r = await fetch(url, opts); } catch (e) { lastErr = new Error('Réseau : ' + e.message); await sleep(5000); continue; }
    if (r.ok) return r;
    const body = await r.text().catch(() => '');
    lastErr = new Error('Agnes ' + r.status + ' : ' + body.slice(0, 200));
    if ([408, 429, 500, 502, 503, 504, 520, 522, 524].includes(r.status)) { await sleep(10000 * (i + 1)); continue; }
    throw lastErr;
  }
  throw lastErr;
}
const authHeaders = key => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key });

async function makeScript(key, topic, lang, count, fmtName, fmt, agent) {
  const who = agent ? 'Main character: ' + agent + '. ' : '';
  // On force l'IA à décrire du MOUVEMENT
  const prompt =
    'You write short video scripts with real motion.\nTopic: "' + topic + '"\nIMPORTANT: the video must show motion. Describe the dynamic action clearly (e.g. "the cat is dancing, moving its paws rhythmically").\nVideo type: ' + fmtName + ' (' + fmt.style + ')\n' +
    'Narration language: ' + lang + '\n' + (STYLES[$('styleSelect').value] ? 'Narration style: ' + STYLES[$('styleSelect').value].narr + '\n' : '') + 'Create exactly ' + count + ' scenes, each a clip of about 5 seconds.\n' +
    '- narration_text: written in ' + lang + ', 10 to 18 words, no emojis.\n' +
    '- visual_prompt: in English, one highly detailed cinematic shot describing the MOVEMENT and camera movement. ' + who +
    ' Never include text, captions or logos.\n' +
    'Return ONLY a JSON array: [{"scene_number":1,"narration_text":"...","visual_prompt":"..."}]';
  const r = await agnesFetch(AGNES_BASE + '/chat/completions', {
    method: 'POST', headers: authHeaders(key),
    body: JSON.stringify({ model: MODEL_TEXT, messages: [{ role: 'user', content: prompt }], temperature: 0.7 })
  });
  const d = await r.json();
  const txt = d.choices[0].message.content;
  const a = txt.indexOf('['), b = txt.lastIndexOf(']');
  if (a < 0 || b < 0) throw new Error('Scénario illisible, réessaie.');
  const arr = JSON.parse(txt.slice(a, b + 1));
  return arr.slice(0, count);
}

function findVideoUrl(o) {
  let found = null;
  (function walk(v, k) {
    if (found || v == null) return;
    if (typeof v === 'string') {
      if (/^https?:\/\//i.test(v) && (/\.(mp4|webm|mov)(\?|#|$)/i.test(v) || /video/i.test(k || ''))) found = v;
    } else if (typeof v === 'object') { for (const kk in v) walk(v[kk], kk); }
  })(o, '');
  return found;
}
function findStatus(o) {
  let s = '';
  (function walk(v) {
    if (s || !v || typeof v !== 'object') return;
    for (const k in v) {
      if (/^(status|state)$/i.test(k) && typeof v[k] === 'string') { s = v[k]; return; }
      walk(v[k]);
    }
  })(o);
  return s;
}

async function makeClip(key, prompt, size, onProgress) {
  const r = await agnesFetch(AGNES_BASE + '/videos', {
    method: 'POST', headers: authHeaders(key),
    body: JSON.stringify({ model: MODEL_VIDEO, prompt, width: size.gw, height: size.gh, num_frames: NUM_FRAMES, frame_rate: FRAME_RATE })
  });
  const d = await r.json();
  const id = d.video_id || d.id || (d.data && (d.data.video_id || d.data.id)) || d.task_id;
  if (!id) throw new Error('Pas de video_id : ' + JSON.stringify(d).slice(0, 200));
  
  // Attente de la génération (peut prendre 3 à 5 minutes)
  for (let t = 0; t < 120; t++) { 
    await sleep(5000);
    onProgress && onProgress(t * 5);
    const pr = await agnesFetch(AGNES_ROOT + '/agnesapi?video_id=' + encodeURIComponent(id), { headers: { 'Authorization': 'Bearer ' + key } });
    const pd = await pr.json();
    const st = findStatus(pd), url = findVideoUrl(pd);
    if (/fail|error|cancel/i.test(st)) throw new Error('Échec Agnes : ' + JSON.stringify(pd).slice(0, 200));
    if (url) return url;
  }
  throw new Error('Délai dépassé (la vidéo a mis trop de temps à se générer).');
}

/* ========= VOIX ========= */
const LANGCODE = { 'Français': 'fr', 'Anglais': 'en', 'Espagnol': 'es', 'Allemand': 'de', 'Italien': 'it', 'Portugais': 'pt' };
const PUTER_LANG = { 'Français': 'fr-FR', 'Anglais': 'en-GB', 'Espagnol': 'es-ES', 'Allemand': 'de-DE', 'Italien': 'it-IT', 'Portugais': 'pt-BR' };
function loadPuter() {
  return new Promise(res => {
    if (window.puter) return res(true);
    const sc = document.createElement('script');
    sc.src = 'https://js.puter.com/v2/';
    sc.onload = () => res(true); sc.onerror = () => res(false);
    document.head.appendChild(sc);
  });
}
function markVoice() { try { if (window.puter && puter.auth.isSignedIn()) $('voiceBtn').textContent = '✅ Voix réaliste activée'; } catch (e) {} }
async function enableVoice() {
  if (!(await loadPuter())) { alert('Service de voix inaccessible.'); return; }
  try {
    if (!puter.auth.isSignedIn()) await puter.auth.signIn();
    try { localStorage.setItem('novaPuter', '1'); } catch (e) {}
    markVoice();
  } catch (e) { alert("Connexion annulée."); }
}
async function fetchVoice(text, lang, female) {
  const v = VOICES[lang][female ? 1 : 0];
  let blob = null;
  try {
    if (window.puter && puter.auth.isSignedIn()) {
      const audio = await puter.ai.txt2speech(text, { voice: v, engine: 'standard', language: PUTER_LANG[lang] });
      blob = await fetchBlob(audio.src);
    }
  } catch (e) {}
  if (!blob) blob = await fetchBlob('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + LANGCODE[lang] + '&q=' + encodeURIComponent(text.slice(0, 190)));
  if (!blob) return null;
  try { return await audioCtx.decodeAudioData(await blob.arrayBuffer()); } catch (e) { return null; }
}
async function fetchBlob(url) {
  const tries = [url];
  if (!url.startsWith('data:')) tries.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
  for (const u of tries) {
    try { const r = await fetch(u); if (r.ok) { const b = await r.blob(); if (b.size) return b; } } catch (e) {}
  }
  return null;
}

/* ========= GÉNÉRATION ========= */
function addCard(text, fmt) {
  const d = document.createElement('div');
  d.className = 'scene-item';
  d.innerHTML = '<div class="scene-media"></div><div class="scene-content"><div class="st"></div><p class="tx"></p></div>';
  d.querySelector('.tx').textContent = text;
  const m = d.querySelector('.scene-media');
  if (fmt.o === 's') { m.style.width = '110px'; m.style.height = '110px'; }
  if (fmt.o === 'h') { m.style.width = '150px'; m.style.height = '100px'; }
  $('scenesContainer').appendChild(d);
  return d;
}
const cardStatus = (c, t) => { c.querySelector('.st').textContent = t; };
function showClip(card, url) {
  const v = document.createElement('video');
  v.src = url; v.controls = true; v.muted = true; v.loop = true; v.playsInline = true;
  const m = card.querySelector('.scene-media'); m.innerHTML = ''; m.appendChild(v);
}

let scenes = [];
let run = null;

async function express() {
  if (await generateScript()) generateMedia();
}

async function generateScript() {
  const key = $('agnesApiKey').value.trim(), topic = $('topicInput').value.trim();
  if (!key || !topic) { alert('Ajoute ta clé API et décris ta vidéo.'); return false; }
  try { localStorage.setItem('agnesApiKey', key); } catch (e) {}
  const count = Math.min(4, Math.max(1, parseInt($('sceneCount').value) || 1));
  const btn = $('generateBtn');
  btn.disabled = true; btn.textContent = '⏳ Écriture...';
  try {
    scenes = await makeScript(key, topic, $('langSelect').value, count, currentFormat, FORMATS[currentFormat], $('agentSelect').value);
    lastTitle = topic.slice(0, 40);
    renderScenario();
    $('scenarioCard').style.display = 'block';
    $('scenarioCard').scrollIntoView({ behavior: 'smooth' });
    return true;
  } catch (e) { alert('Erreur : ' + e.message); return false; }
  finally { btn.disabled = false; btn.textContent = '1. Écrire le scénario'; }
}

function renderScenario() {
  const box = $('scenarioList');
  box.innerHTML = '';
  scenes.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'scene-item'; d.style.flexDirection = 'column';
    d.innerHTML = '<label></label><textarea class="n"></textarea><label>Action (en anglais)</label><textarea class="v"></textarea>';
    d.querySelector('label').textContent = 'Scène ' + (i + 1) + ' : texte';
    const n = d.querySelector('.n'), v = d.querySelector('.v');
    n.value = s.narration_text || ''; v.value = s.visual_prompt || '';
    n.oninput = () => { s.narration_text = n.value; };
    v.oninput = () => { s.visual_prompt = v.value; };
    box.appendChild(d);
  });
}

async function buildSlot(slot) {
  const { key, size, fmt } = run, sc = slot.scene;
  cardStatus(slot.card, '⏳ Génération de la vraie vidéo...');
  const voiceP = slot.voice ? Promise.resolve(slot.voice) : fetchVoice(sc.narration_text, run.lang, run.female);
  const vp = sc.visual_prompt + '. ' + fmt.style + '.';
  
  const url = await makeClip(key, vp, size, sec => cardStatus(slot.card, '🎬 Génération... ' + sec + 's'));
  
  slot.url = url; 
  slot.blob = await fetchBlob(url);
  slot.voice = await voiceP;
  cardStatus(slot.card, '✅ Scène prête'); 
  showClip(slot.card, url);
}

async function generateMedia() {
  const key = $('agnesApiKey').value.trim(), lang = $('langSelect').value, agent = $('agentSelect').value;
  const fmt = FORMATS[currentFormat], size = SIZES[fmt.o];
  
  scenes = scenes.filter(s => (s.narration_text || '').trim() && (s.visual_prompt || '').trim());
  if (!scenes.length) { alert('Ajoute une narration.'); return; }
  
  const btn = $('mediaBtn');
  btn.disabled = true; btn.textContent = '⏳ Génération en cours...';
  $('workspace').style.display = 'block'; $('previewArea').style.display = 'none';
  $('scenesContainer').innerHTML = ''; videoBlob = null;
  $('workspace').scrollIntoView({ behavior: 'smooth' });
  
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  
  run = { key, size, fmt, lang, female: (!agent || /woman/i.test(agent)), slots: [] };
  
  try {
    scenes.forEach(sc => run.slots.push({ scene: { narration_text: sc.narration_text, visual_prompt: sc.visual_prompt }, card: addCard(sc.narration_text, fmt) }));
    let next = 0, done = 0;
    setStatus('Génération des scènes vidéo (cela peut prendre plusieurs minutes)...');
    
    // Génération séquentielle pour éviter de surcharger l'API
    while (next < run.slots.length) {
      const slot = run.slots[next++];
      try { await buildSlot(slot); } catch (e) { cardStatus(slot.card, '❌ ' + e.message); }
      setStatus('Scènes terminées : ' + (++done) + '/' + run.slots.length);
    }
    
    if (!run.slots.some(x => x.url)) throw new Error("Aucune scène n'a pu être générée. L'API vidéo a peut-être échoué. Réessaie.");
    
    if (await assemble()) setStatus('✅ Vidéo terminée !');
  } catch (e) { setStatus('Erreur : ' + e.message, true); }
  finally { btn.disabled = false; btn.textContent = '2. Générer la vraie vidéo'; }
}

async function assemble() {
  const items = run.slots.filter(x => x.blob).map((x, i) => ({ idx: i, text: x.scene.narration_text, blob: x.blob, voice: x.voice }));
  if (!items.length) { setStatus('Erreur lors de la récupération des vidéos.', true); return false; }
  setStatus('Assemblage final...');
  await renderFinal(items, run.size, run.fmt);
  return true;
}

function pickMime() {
  const c = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  for (const m of c) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
  return '';
}
function coverDraw(ctx, v, W, H) {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  const s = Math.max(W / vw, H / vh), w = vw * s, h = vh * s;
  ctx.drawImage(v, (W - w) / 2, (H - h) / 2, w, h);
}
function drawSubs(ctx, text, W, H, fmt) {
  const fs = Math.round(W * (fmt.o === 'h' ? 0.032 : 0.048));
  ctx.font = '700 ' + fs + 'px Inter, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const maxW = W * 0.84, lines = [];
  let cur = '';
  for (const w of text.split(/\s+/)) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  const lh = fs * 1.3, bottom = H * (fmt.o === 'v' ? 0.78 : 0.9), top = bottom - lines.length * lh;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(W * 0.04, top - fs * 0.4, W * 0.92, lines.length * lh + fs * 0.8);
  ctx.fillStyle = '#fff';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, top + lh * (i + 0.5)));
}

async function renderFinal(items, size, fmt) {
  const W = size.cw, H = size.ch;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  
  const dest = audioCtx.createMediaStreamDestination();
  const mime = pickMime();
  videoExt = mime.includes('mp4') ? 'mp4' : 'webm';
  const stream = new MediaStream([...canvas.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 4000000 } : {});
  const chunks = [];
  
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(res => { rec.onstop = res; });
  rec.start(500);

  for (const it of items) {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.loop = true;
    v.src = URL.createObjectURL(it.blob);
    await new Promise(r => { v.onloadedmetadata = r; v.onerror = r; setTimeout(r, 4000); });
    
    const vd = (isFinite(v.duration) && v.duration > 0 ? v.duration : 5);
    const dur = Math.max(vd, it.voice ? it.voice.duration + 0.4 : 0) * 1000;
    
    await v.play().catch(() => {});
    if (it.voice) { const s = audioCtx.createBufferSource(); s.buffer = it.voice; s.connect(dest); s.start(); }
    
    const start = performance.now();
    await new Promise(res => {
      const tick = () => {
        const el = performance.now() - start;
        if (el >= dur) { res(); return; }
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        coverDraw(ctx, v, W, H);
        drawSubs(ctx, it.text, W, H, fmt);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    v.pause();
    URL.revokeObjectURL(v.src);
  }
  
  await sleep(300);
  rec.stop(); await stopped;
  
  videoBlob = new Blob(chunks, { type: (rec.mimeType || mime || 'video/webm').split(';')[0] });
  const p = $('videoPlayer');
  p.src = URL.createObjectURL(videoBlob);
  $('previewArea').style.display = 'block';
  p.play().catch(() => {});
  $('previewArea').scrollIntoView({ behavior: 'smooth' });
}

function downloadVideo() {
  if (!videoBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(videoBlob); a.download = 'novastudio.' + videoExt;
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareVideo() {
  if (!videoBlob) return;
  const file = new File([videoBlob], 'novastudio.' + videoExt, { type: videoBlob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'NovaStudio' }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  downloadVideo();
}

/* ========= PROJETS ========= */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('novastudio', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('videos', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function saveProject() {
  if (!videoBlob) return;
  try {
    const d = await openDB();
    const tx = d.transaction('videos', 'readwrite');
    tx.objectStore('videos').add({ title: lastTitle, date: Date.now(), blob: videoBlob, ext: videoExt });
    tx.oncomplete = () => alert('Vidéo sauvegardée !');
  } catch (e) { alert('Erreur : ' + e.message); }
}
async function renderProjects() {
  const box = $('projectsList');
  box.innerHTML = '';
  try {
    const d = await openDB();
    const req = d.transaction('videos').objectStore('videos').getAll();
    req.onsuccess = () => {
      const list = req.result.reverse();
      if (!list.length) { box.textContent = 'Aucune vidéo.'; return; }
      list.forEach(p => {
        const div = document.createElement('div'); div.className = 'proj'; div.style.marginBottom = '1.5rem';
        const t = document.createElement('div'); t.style.fontWeight = '600';
        t.textContent = (p.title || 'Vidéo') + ' · ' + new Date(p.date).toLocaleDateString('fr-FR');
        const v = document.createElement('video'); v.controls = true; v.playsInline = true; v.src = URL.createObjectURL(p.blob);
        const dl = document.createElement('button'); dl.className = 'btn-green'; dl.textContent = '⬇️ Télécharger';
        dl.onclick = () => { const a = document.createElement('a'); a.href = v.src; a.download = 'novastudio.' + (p.ext || 'webm'); document.body.appendChild(a); a.click(); a.remove(); };
        const del = document.createElement('button'); del.className = 'btn-red'; del.textContent = '🗑️ Supprimer';
        del.onclick = async () => { const db2 = await openDB(); const tx = db2.transaction('videos', 'readwrite'); tx.objectStore('videos').delete(p.id); tx.oncomplete = renderProjects; };
        div.append(t, v, dl, del); box.appendChild(div);
      });
    };
  } catch (e) { box.textContent = 'Erreur : ' + e.message; }
}
</script>
